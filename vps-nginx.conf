# =========================================================================
# VPS Host Nginx Configuration — Project Technodha
# File Path on VPS: /etc/nginx/sites-available/technodha.conf
# =========================================================================

# --- 1. FRONTEND APP (techstore.pritesh.site) ➔ Proxies to Docker port 8001 ---
server {
    listen 80;
    listen [::]:80;
    server_name techstore.pritesh.site;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- 2. BACKEND API (api.techstore.pritesh.site) ➔ Proxies to Docker port 8000 ---
server {
    listen 80;
    listen [::]:80;
    server_name api.techstore.pritesh.site;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
