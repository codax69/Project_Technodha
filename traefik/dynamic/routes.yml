http:
  routers:
    backend-router:
      rule: "PathPrefix(`/api`)"
      entryPoints:
        - "web"
      service: "backend-service"
      priority: 100
      middlewares:
        - "security-headers"

    frontend-router:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - "web"
      service: "frontend-service"
      priority: 10
      middlewares:
        - "security-headers"

  services:
    backend-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://backend:8000"
        healthCheck:
          path: "/api/v1/health/"
          interval: "10s"
          timeout: "3s"

    frontend-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://frontend:80"

  middlewares:
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true

