name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: technodha_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests with Pytest
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: True
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: technodha_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          pytest

  frontend-tests:
    name: Frontend Build & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm run build

  publish-images:
    name: Build and publish Docker images to GHCR
    needs: [backend-tests, frontend-tests]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute 12-character short commit SHA
        id: vars
        run: echo "sha12=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codax69/technodha-be:${{ steps.vars.outputs.sha12 }}
            ghcr.io/codax69/technodha-be:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codax69/technodha-fe:${{ steps.vars.outputs.sha12 }}
            ghcr.io/codax69/technodha-fe:latest

  deploy-vps:
    name: Deploy GHCR images to VPS over SSH
    needs: [publish-images]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Pull Latest Code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_PROJECT_PATH || '/opt/technodha' }}"
            echo "Deploy target directory: $TARGET_DIR"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Directory does not exist. Creating target directory..."
              if ! mkdir -p "$TARGET_DIR" 2>/dev/null; then
                echo "Standard mkdir failed. Retrying with sudo..."
                sudo mkdir -p "$TARGET_DIR"
                sudo chown -R "$(id -un)":"$(id -gn)" "$TARGET_DIR"
              fi
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            if [ ! -d ".git" ]; then
              echo "Git repository missing in target directory. Cloning contents..."
              git clone https://github.com/${{ github.repository }}.git .
            fi
            git fetch origin
            git pull origin main || git pull origin master
            if [ ! -f ".env" ] && [ -f ".env.example" ]; then
              echo "Creating initial .env from .env.example..."
              cp .env.example .env
            fi

      - name: Compute 12-character short commit SHA
        id: vars
        run: echo "sha12=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Restart Services with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.sha12 }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_PROJECT_PATH || '/opt/technodha' }}"
            cd "$TARGET_DIR"
            # Free ports 80/443 if host web server (nginx/apache2/caddy) is active
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              echo "Stopping conflicting host web services..."
              sudo systemctl stop nginx apache2 caddy 2>/dev/null || true
              sudo systemctl disable nginx apache2 caddy 2>/dev/null || true
            fi
            if [ -n "$GHCR_TOKEN" ]; then
              echo "Logging into GHCR..."
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            else
              echo "GHCR_TOKEN not provided, attempting pull without login..."
            fi
            # Resilient pull with 3 retries against CDN connection resets
            for i in 1 2 3; do
              echo "Pulling images (attempt $i)..."
              if docker compose pull; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "Failed to pull GHCR images after 3 attempts."
                exit 1
              fi
              sleep 5
            done
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
