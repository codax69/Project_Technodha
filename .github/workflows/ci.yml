name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: technodha_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests with Pytest
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: True
          DB_ENGINE: django.db.backends.postgresql
          POSTGRES_DB: technodha_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd backend
          pytest

  frontend-tests:
    name: Frontend Build & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm run build

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  deploy-vps:
    name: Deploy to VPS over SSH
    needs: [backend-tests, frontend-tests]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Pull Latest Code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_PROJECT_PATH || '/opt/technodha' }}"
            echo "Deploy target directory: $TARGET_DIR"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Directory does not exist. Creating and cloning repository..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            if [ ! -d ".git" ]; then
              echo "Git repository missing in target directory. Cloning contents..."
              git clone https://github.com/${{ github.repository }}.git .
            fi
            git fetch origin
            git pull origin main || git pull origin master
            if [ ! -f ".env" ] && [ -f ".env.example" ]; then
              echo "Creating initial .env from .env.example..."
              cp .env.example .env
            fi

      - name: Download Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Copy Dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "frontend/dist"
          target: ${{ secrets.VPS_PROJECT_PATH || '/opt/technodha' }}

      - name: Restart Services with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_PROJECT_PATH || '/opt/technodha' }}"
            cd "$TARGET_DIR"
            chmod +x ./setup_permissions.sh
            ./setup_permissions.sh
            # Resilient pull with 3 retries against CDN connection resets
            for i in 1 2 3; do
              echo "Pulling images (attempt $i)..."
              docker compose pull && break || sleep 5
            done
            docker compose up -d --build --remove-orphans
            docker image prune -f

