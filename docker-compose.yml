services:
  db:
    image: postgres:15-alpine
    container_name: technodha_postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technodha_db}
      POSTGRES_USER: ${POSTGRES_USER:-technodha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-technodha_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technodha_user} -d ${POSTGRES_DB:-technodha_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: technodha_django_backend
    command: >
      sh -c "python manage.py makemigrations authentication products orders &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-technodha-task1-secret-key-2026}
      - DEBUG=${DEBUG:-True}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - POSTGRES_DB=${POSTGRES_DB:-technodha_db}
      - POSTGRES_USER=${POSTGRES_USER:-technodha_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-technodha_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-dltmiswel}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: technodha_react_frontend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
