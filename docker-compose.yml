services:
  # Application Backend (Non-Root User UID 1001)
  backend:
    image: ghcr.io/codax69/technodha-be:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: technodha-be
    restart: unless-stopped
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      sh -c "python manage.py migrate &&
             python seed_data.py &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --worker-class gthread --timeout 60 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -"
    volumes:
      - backend_media:/app/media
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-technodha-task1-secret-key-2026}
      - DEBUG=${DEBUG:-True}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - POSTGRES_DB=${POSTGRES_DB:-technodha_db}
      - POSTGRES_USER=${POSTGRES_USER:-technodha_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-technodha_pass}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-dltmiswel}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - USE_X_FORWARDED_HOST=${USE_X_FORWARDED_HOST:-True}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://techstore.pritesh.site,https://api.techstore.pritesh.site}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal_net
      - db_net
    depends_on:
      db:
        condition: service_healthy

  # Frontend Web Client
  frontend:
    image: ghcr.io/codax69/technodha-fe:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: technodha-fe
    restart: unless-stopped
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    networks:
      - internal_net
    depends_on:
      - backend

  # Database Engine
  db:
    image: postgres:15-alpine
    container_name: technodha-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technodha_db}
      POSTGRES_USER: ${POSTGRES_USER:-technodha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-technodha_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-technodha_user} -d ${POSTGRES_DB:-technodha_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net

networks:
  internal_net:
    driver: bridge
    name: technodha_internal_net
  db_net:
    driver: bridge
    name: technodha_db_net
    internal: true

volumes:
  postgres_data:
  backend_media:
