# --- FRONTEND SERVER BLOCK (techstore.pritesh.site) ---
server {
    listen 80;
    server_name techstore.pritesh.site localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($host !~* ^(techstore\.pritesh\.site|localhost)$) {
            return 400;
        }
        return 301 https://techstore.pritesh.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name techstore.pritesh.site localhost;

    ssl_certificate /etc/letsencrypt/live/techstore.pritesh.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techstore.pritesh.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- BACKEND API SERVER BLOCK (api.techstore.pritesh.site) ---
